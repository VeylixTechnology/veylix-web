<app-page-hero
  eyebrow="Technology Stack"
  title="Enterprise-grade technologies and tools"
  subtitle="We standardize on proven, scalable frameworks chosen for reliability, community support, and long-term viability."
/>

<section class="section">
  <div class="container">
    <app-section-heading
      eyebrow="Our Stack"
      title="Tools and frameworks we specialize in"
      subtitle="Industry-standard technologies that deliver performance, reliability, and long-term maintainability."
      [center]="true"
    />

    <div class="tech-grid">
      @for (group of stack; track group.title; let i = $index) {
        <article
          class="tech-card"
          [class.tech-card--wide]="group.items.length > 4"
          reveal
          [revealDelay]="(i % 3) * 80"
        >
          <div class="tech-card__head">
            <span class="tech-card__icon">
              <span class="material-icons-round">{{ group.icon }}</span>
            </span>
            <h3>{{ group.title }}</h3>
          </div>
          <div class="tech-card__items">
            @for (item of group.items; track item) {
              <span class="tech-tag">{{ item }}</span>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>

<section class="section--tight" style="padding-top: 0">
  <app-cta-section />
</section>
