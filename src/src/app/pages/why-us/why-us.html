<app-page-hero
  eyebrow="Why Choose Us"
  title="A technology partner for enterprise transformation"
  subtitle="We bring together technical depth, domain expertise, and proven delivery to address your most critical operational challenges."
/>

<section class="section">
  <div class="container">
    <app-section-heading
      eyebrow="Our Strengths"
      title="Why enterprises partner with us"
      subtitle="We bring specialized expertise, proven processes, and genuine commitment to your outcomes."
      [center]="true"
    />

    <div class="grid grid-4">
      @for (reason of reasons; track reason.title; let i = $index) {
        <article class="card why-card" reveal [revealDelay]="(i % 4) * 70">
          <div class="card-icon">
            <span class="material-icons-round">{{ reason.icon }}</span>
          </div>
          <h3>{{ reason.title }}</h3>
          <p class="muted">{{ reason.description }}</p>
        </article>
      }
    </div>
  </div>
</section>

<!-- Tagline banner -->
<section class="section--tight">
  <div class="container">
    <div class="values" reveal>
      <div class="values__glow"></div>
      <span class="material-icons-round values__icon">spa</span>
      <h2 class="values__title">{{ company.tagline }}</h2>
      <p class="values__text">
        We believe the best technology partnerships are built on integrity, technical excellence, and genuine commitment
        to your business success.
      </p>
    </div>
  </div>
</section>

<section class="section--tight" style="padding-top: 0">
  <app-cta-section />
</section>
